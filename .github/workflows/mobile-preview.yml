name: FitGoIn Android preview APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-preview.yml'
      - 'scripts/build.mjs'
      - 'site.webmanifest'
      - 'app-icons/**'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-preview.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Build existing FitGoIn web application
        run: npm run build
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Create and synchronize Android project
        working-directory: mobile
        run: |
          npx cap add android
          npx cap sync android
      - name: Assemble testable Android debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitGoIn-Android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
